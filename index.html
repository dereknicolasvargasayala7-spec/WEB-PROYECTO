<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>El Refugio del Reino | Cafetería</title>

    <link rel="stylesheet" href="variables.css">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="logo.css">
    <link rel="stylesheet" href="navegacion.css">
    <link rel="stylesheet" href="boton.css">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="footer.css">
</head>

<body>

    <!-- encabezado -->
    <header class="header">
        <div class="contenedor header__contenido">

            <!-- logo -->
            <a
                href="index.html"
                class="logo"
                aria-label="El Refugio del Reino, inicio"
            >
                <span class="logo__nombre">
                    El Refugio del Reino
                </span>

                <span class="logo__descripcion">
                    Café y repostería
                </span>
            </a>

            <!-- navegación -->
            <nav class="navegacion" aria-label="Navegación principal">
                <a
                    href="index.html"
                    class="navegacion__enlace navegacion__enlace--activo"
                    aria-current="page"
                >
                    Inicio
                </a>

                <a href="menu.html" class="navegacion__enlace">
                    Menú
                </a>

                <a href="nosotros.html" class="navegacion__enlace">
                    Nosotros
                </a>

                <a href="contacto.html" class="navegacion__enlace">
                    Contacto
                </a>

                <a href="visitanos.html" class="boton">
                    Visítanos
                </a>
            </nav>

        </div>
    </header>

    <!-- contenido principal -->
    <main id="contenido" class="main">
        <!-- aquí agregaremos el contenido de Inicio -->
    </main>

    <!-- pie de página -->
    <footer class="footer">
        <div class="contenedor footer__contenido">
            <p class="footer__texto">
                El Refugio del Reino · Café y repostería
            </p>
        </div>
    </footer>

</body>
</html>
